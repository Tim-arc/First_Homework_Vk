{% extends 'qa/main_layout.html' %}

{% block content %}
<main class="root__main">
    <h1>{% if is_edit %}Редактирование ответа{% else %}Ответ{% endif %}</h1>
    <p><a href="{% url 'qa:question_detail' question_id=question.id %}">← Вернуться к вопросу</a></p>

    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div style="margin-bottom: 10px;">
                {{ field }}
                {% if field.errors %}
                    <div style="color: red;">{{ field.errors }}</div>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit">Сохранить</button>
    </form>
</main>
{% endblock %}
