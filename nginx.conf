user timofey staff;
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=my_cache:10m max_size=1g inactive=60m use_temp_path=off;

    upstream ask_timofey_backend {
        server 127.0.0.1:8000;
    }

    server {
        listen       80;
        server_name  localhost;
        
        set $project_root /Users/timofey/Developer/Vk_edu/Project;

        location ^~ /uploads/ {
            alias $project_root/uploads/;
            expires 30d;
        }

        location /static/ {
            # Важно: используем alias, а не root
            # Путь должен вести к папке, которую мы создали на шаге 1
            alias /Users/timofey/Developer/Vk_edu/Project/static_content/;
            expires 30d;
        }
        
        # Явное указание для медиа (аватарок)
        location /media/ {
            alias /Users/timofey/Developer/Vk_edu/Project/media/;
            expires 30d;
        }

        location / {
            proxy_pass http://ask_timofey_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            proxy_cache my_cache;
            proxy_cache_valid 200 302 10m;
            proxy_cache_valid 404      1m;
        }
    }
}